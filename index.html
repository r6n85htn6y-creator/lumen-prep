<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131d34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumen Prep">
  <meta name="description" content="An independent IELTS study companion with practice, writing drafts, speaking timers and progress tracking.">
  <meta property="og:title" content="Lumen Prep | IELTS Study Studio">
  <meta property="og:description" content="Small steps. Stronger English.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Lumen Prep — IELTS Study Studio</title>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 19h18M5 15l6-6 4 4 5-7M16 6h4v4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6a8 8 0 0 0-9-2v15a8 8 0 0 1 9 2m0-15a8 8 0 0 1 9-2v15a8 8 0 0 0-9 2m0-15v15"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 13V12a8 8 0 0 1 16 0v1M4 13v5a2 2 0 0 0 2 2h2v-7H6a2 2 0 0 0-2 2m16-2v5a2 2 0 0 1-2 2h-2v-7h2a2 2 0 0 1 2 2"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m14 5 5 5M3 21l4.5-.8L20 7.7A3 3 0 0 0 16.3 4L3.8 16.5z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4m-4 0h8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
  </svg>
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <div class="brand" role="banner"><span class="brand-symbol">✳</span><span class="brand-name">lumen<span class="brand-dot">.</span></span><span class="brand-sub">IELTS STUDIO</span></div>
      <button class="avatar-btn" data-navigate="profile" type="button" aria-label="Open profile"><span>ME</span><span class="online-dot"></span></button>
    </header>
    <main id="content" aria-live="polite" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" class="nav-item active" data-navigate="home" aria-current="page"><svg><use href="#i-home"/></svg><span>Home</span></button>
      <button type="button" class="nav-item" data-navigate="practice"><svg><use href="#i-grid"/></svg><span>Practice</span></button>
      <button type="button" class="nav-item" data-navigate="progress"><svg><use href="#i-trend"/></svg><span>Progress</span></button>
      <button type="button" class="nav-item" data-navigate="profile"><svg><use href="#i-user"/></svg><span>Profile</span></button>
    </nav>
  </div>
  <div role="status" aria-live="polite" id="toast" class="toast" hidden></div>
  <script src="./app.js" defer></script>
</body>
</html>
